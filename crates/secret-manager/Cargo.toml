[package]
name = "caniko-secret-manager"
description = "Declarative secret management for NixOS — resolve and render age/agenix secrets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme.workspace = true
documentation = "https://docs.rs/caniko-secret-manager"
keywords = ["nix", "nixos", "agenix", "secrets", "age"]
categories = ["command-line-utilities", "cryptography"]
include = ["Cargo.toml", "README.md", "LICENSE", "src/**", "tests/**"]

[package.metadata.docs.rs]
all-features = true

[[bin]]
name = "secret-manager"
path = "src/main.rs"

[lib]
name = "secret_manager"
path = "src/lib.rs"

[dependencies]
nix-manager-core.workspace = true
anyhow.workspace = true
base64.workspace = true
clap.workspace = true
dbus = { version = "0.9", features = ["vendored"] }
forgejo-api.workspace = true
libc.workspace = true
pklx.workspace = true
rand.workspace = true
reqwest.workspace = true
ring.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true
url.workspace = true
walkdir.workspace = true
tempfile.workspace = true
zeroize.workspace = true

[dev-dependencies]
tempfile.workspace = true
age = { version = "0.11.5", default-features = false, features = ["plugin"] }
age-core = "0.11"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/{ version }/secret-manager-{ version }-aarch64-unknown-linux-musl.tar.gz"
pkg-fmt = "tgz"
bin-dir = "bin/{ bin }{ binary-ext }"
[package.metadata.binstall.overrides.aarch64-unknown-linux-musl]
pkg-url = "{ repo }/releases/download/{ version }/secret-manager-{ version }-aarch64-unknown-linux-musl.tar.gz"
pkg-fmt = "tgz"
bin-dir = "bin/{ bin }{ binary-ext }"
[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/{ version }/secret-manager-{ version }-x86_64-unknown-linux-musl.tar.gz"
pkg-fmt = "tgz"
bin-dir = "bin/{ bin }{ binary-ext }"
[package.metadata.binstall.overrides.x86_64-unknown-linux-musl]
pkg-url = "{ repo }/releases/download/{ version }/secret-manager-{ version }-x86_64-unknown-linux-musl.tar.gz"
pkg-fmt = "tgz"
bin-dir = "bin/{ bin }{ binary-ext }"
