[package]
name = "secret-manager"
description = "Declarative secret management for NixOS — resolve and render age/agenix secrets"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "secret-manager"
path = "src/main.rs"

[lib]
name = "secret_manager"
path = "src/lib.rs"

[dependencies]
nix-manager-core.workspace = true
anyhow.workspace = true
base64.workspace = true
clap.workspace = true
dbus = { version = "0.9", features = ["vendored"] }
forgejo-api.workspace = true
libc.workspace = true
pklx.workspace = true
rand.workspace = true
reqwest.workspace = true
ring.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true
url.workspace = true
walkdir.workspace = true
tempfile.workspace = true
zeroize.workspace = true

[dev-dependencies]
tempfile.workspace = true
