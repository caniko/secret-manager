[workspace]
resolver = "2"
members = ["crates/secret-manager"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://codeberg.org/caniko/secret-manager"
authors = ["caniko"]

[workspace.dependencies]
nix-manager-core = { git = "https://codeberg.org/caniko/nix-manager-core.git" }
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"

[workspace.metadata.crane]
name = "secret-manager"

[profile.release]
lto = true
strip = true
