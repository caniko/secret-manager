[ci]
runner = "ubuntu-24.04"
runtime = "nix"
provider = "actions"
platform = "github"
publish_crates = true
all_features = false
publish_strategy = "members"

[ci.pages]
repo = "caniko/secret-manager"
canonical_domain = "secret-manager.tartanoglu.com"

[release.github]
repo = "caniko/secret-manager"
target_branch = "trunk"

# Prebuilt musl archives for `cargo binstall caniko-secret-manager`, built on
# native runners per system and attached to the GitHub release.
[release.artifacts]
prebuild_binaries = true
binstall = true
system_runners = { x86_64-linux = "ubuntu-24.04" }
sign = false
