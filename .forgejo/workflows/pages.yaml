name: pages

on:
  push:
    branches:
      - trunk

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pages:
    runs-on: atlas-nix-trusted
    steps:
      - uses: https://code.forgejo.org/actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Build site
        run: nix build .#site
      - name: Deploy to Codeberg Pages
        env:
          GIT_AUTHOR_NAME: forgejo-actions
          GIT_AUTHOR_EMAIL: forgejo-actions@noreply.codeberg.org
          DEPLOY_REMOTE: pages-origin
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          git remote add pages-origin https://caniko:${CODEBERG_TOKEN}@codeberg.org/caniko/secret-manager
          nix run .#deploy-pages
